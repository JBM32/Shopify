<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pixel Dash — Retro Platformer</title>
<style>
  :root { --bg:#1a1c2c; --panel:#29366f; --ink:#f4f4f4; }
  * { box-sizing:border-box; }
  html,body {
    margin:0; height:100%; background:var(--bg);
    color:var(--ink); font-family:"Courier New",monospace;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  #wrap {
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:10px;
  }
  h1 {
    margin:0; font-size:22px; letter-spacing:2px;
    text-shadow:2px 2px 0 #000, 0 0 12px #5d83ff;
  }
  #stage {
    position:relative; image-rendering:pixelated;
    border:4px solid #000; border-radius:6px;
    box-shadow:0 0 0 4px var(--panel), 0 12px 30px rgba(0,0,0,.6);
    max-width:100%;
  }
  canvas { display:block; image-rendering:pixelated; background:#5d8aff; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:rgba(16,18,38,.82); text-align:center; padding:20px;
  }
  #overlay.hidden { display:none; }
  #overlay h2 { margin:0; font-size:30px; text-shadow:2px 2px 0 #000; }
  #overlay p { margin:0; max-width:360px; line-height:1.5; font-size:14px; opacity:.9; }
  .btn {
    cursor:pointer; border:3px solid #000; background:#ffcb3d; color:#2a1a00;
    font-family:inherit; font-weight:bold; font-size:16px; letter-spacing:1px;
    padding:10px 22px; border-radius:6px; box-shadow:0 4px 0 #000;
    transition:transform .05s, box-shadow .05s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #000; }
  .hint { font-size:12px; opacity:.7; }
  #touch { display:none; gap:14px; margin-top:6px; }
  .pad {
    width:64px; height:64px; border:3px solid #000; border-radius:10px;
    background:var(--panel); color:#fff; font-size:24px; font-weight:bold;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 #000;
  }
  .pad:active { transform:translateY(3px); box-shadow:0 1px 0 #000; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <h1>★ PIXEL DASH ★</h1>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
    <div id="overlay">
      <h2 id="ov-title">PIXEL DASH</h2>
      <p id="ov-text">Play as Three Tails, the three-tailed cat! Reach the flag, stomp the Zerox dogs, grab coins, and snag power-ups.</p>
      <button class="btn" id="ov-btn">PLAY</button>
      <p class="hint">← → / A D to move &nbsp;•&nbsp; Space / W / ↑ to jump</p>
    </div>
  </div>
  <div id="touch">
    <div class="pad" id="pad-left">◀</div>
    <div class="pad" id="pad-right">▶</div>
    <div class="pad" id="pad-jump">▲</div>
  </div>
</div>
<script>
(() => {
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
ctx.imageSmoothingEnabled = false;

// ---------- Input ----------
const keys = {};
const setKey = (code, val) => {
  if (["ArrowLeft","KeyA"].includes(code)) keys.left = val;
  if (["ArrowRight","KeyD"].includes(code)) keys.right = val;
  if (["Space","ArrowUp","KeyW"].includes(code)) keys.jump = val;
};
addEventListener("keydown", e => {
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if (state === "intro" && (e.code === "Space" || e.code === "Enter")){ endIntro(); return; }
  setKey(e.code, true);
  if (e.code === "Enter" && state !== "play") startGame();
});
addEventListener("keyup", e => setKey(e.code, false));
const bindPad = (id, k) => {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[k] = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  el.addEventListener("touchstart", on, {passive:false});
  el.addEventListener("touchend", off, {passive:false});
  el.addEventListener("mousedown", on);
  el.addEventListener("mouseup", off);
  el.addEventListener("mouseleave", off);
};
bindPad("pad-left","left"); bindPad("pad-right","right"); bindPad("pad-jump","jump");

// ---------- Audio (Web Audio, generated) ----------
let actx;
function beep(freq, dur, type="square", vol=0.08){
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch(e){}
}
const sfx = {
  jump:  () => beep(520, .12, "square", .06),
  coin:  () => { beep(880,.07,"square",.06); setTimeout(()=>beep(1175,.1,"square",.06),60); },
  stomp: () => beep(160,.12,"sawtooth",.08),
  power: () => { beep(660,.08); setTimeout(()=>beep(990,.08),70); setTimeout(()=>beep(1320,.12),140); },
  hurt:  () => beep(120,.3,"sawtooth",.1),
  win:   () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*120)); },
};

// ---------- World / Level ----------
const TILE = 24;
const GRAV = 0.55, MOVE = 0.7, FRICTION = 0.8, MAXVX = 4.2, JUMP = 11;

// Level legend: # ground/brick, = platform, C coin, E enemy, S speed, J jump, V invincible, F flag, P player
const LEVEL = [
  "                                                                                            ",
  "                                                                                            ",
  "                                                                                            ",
  "                       C C                                  V                               ",
  "                      =====                       C C C                                     ",
  "            C                          C C                ====            C C C              ",
  "           ===            S           =====                          C C        C C    F    ",
  "      C                  ===                       E              =======      =====   ###   ",
  "     ===          C C          C C          E          C C  J                          ###   ",
  "  P        E     =====   ###   =====   ###  =====================        E      ###     ###   ",
  "##############   ###   ##############   ###############          ##############   ###########",
  "##############   ###   ##############   ###############          ##############   ###########",
];
const COLS = Math.max(...LEVEL.map(r => r.length));
const ROWS = LEVEL.length;
const LEVEL_W = COLS * TILE, LEVEL_H = ROWS * TILE;

let solids, coins, enemies, powerups, flag, player, cam, state, score, lives, msg, msgT, particles;

function rectAt(c, r){ return { x:c*TILE, y:r*TILE, w:TILE, h:TILE }; }

function buildLevel(){
  solids = []; coins = []; enemies = []; powerups = []; particles = [];
  flag = null;
  let spawn = { x: TILE*2, y: TILE*2 };
  for (let r=0; r<ROWS; r++){
    const row = LEVEL[r];
    for (let c=0; c<row.length; c++){
      const ch = row[c];
      const x = c*TILE, y = r*TILE;
      if (ch === "#" || ch === "=") solids.push({...rectAt(c,r), type: ch==="="?"plat":"brick"});
      else if (ch === "C") coins.push({ x:x+TILE/2, y:y+TILE/2, got:false, t:Math.random()*6 });
      else if (ch === "E") enemies.push({ x:x+3, y:y+2, w:TILE-6, h:TILE-4, vx:-0.9, vy:0, alive:true });
      else if (ch === "S") powerups.push({ x:x+4, y:y+4, w:TILE-8, h:TILE-8, kind:"speed", got:false, t:0 });
      else if (ch === "J") powerups.push({ x:x+4, y:y+4, w:TILE-8, h:TILE-8, kind:"jump", got:false, t:0 });
      else if (ch === "V") powerups.push({ x:x+4, y:y+4, w:TILE-8, h:TILE-8, kind:"star", got:false, t:0 });
      else if (ch === "F") flag = { x:x+TILE/2, y:y, w:6, h:TILE*3 };
      else if (ch === "P") spawn = { x, y };
    }
  }
  player = {
    x: spawn.x, y: spawn.y, w: 16, h: 22, vx:0, vy:0,
    onGround:false, face:1, anim:0,
    speedT:0, jumpT:0, starT:0, hurtT:0
  };
  cam = { x:0, y:0 };
}

// ---------- Collision ----------
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function moveAndCollide(o){
  // X axis
  o.x += o.vx;
  for (const s of solids){
    if (aabb(o,s)){
      if (o.vx > 0) o.x = s.x - o.w;
      else if (o.vx < 0) o.x = s.x + s.w;
      o.vx = 0;
    }
  }
  // Y axis
  o.y += o.vy;
  o.onGround = false;
  for (const s of solids){
    if (aabb(o,s)){
      if (o.vy > 0){ o.y = s.y - o.h; o.onGround = true; }
      else if (o.vy < 0){ o.y = s.y + s.h; }
      o.vy = 0;
    }
  }
}

function spawnParticles(x,y,color,n=8){
  for (let i=0;i<n;i++)
    particles.push({ x, y, vx:(Math.random()-.5)*4, vy:(Math.random()-1.2)*3,
      life:1, color });
}

// ---------- Update ----------
function update(){
  if (state !== "play") return;
  const p = player;
  p.anim += Math.abs(p.vx)*0.2 + 0.05;

  // timers
  ["speedT","jumpT","starT","hurtT"].forEach(k => { if (p[k]>0) p[k]--; });

  const accel = MOVE * (p.speedT>0 ? 1.5 : 1);
  if (keys.left){ p.vx -= accel; p.face=-1; }
  if (keys.right){ p.vx += accel; p.face=1; }
  if (!keys.left && !keys.right) p.vx *= FRICTION;
  const maxv = MAXVX * (p.speedT>0 ? 1.45 : 1);
  p.vx = Math.max(-maxv, Math.min(maxv, p.vx));

  if (keys.jump && p.onGround){
    p.vy = -(JUMP * (p.jumpT>0 ? 1.3 : 1));
    p.onGround = false; sfx.jump();
  }
  if (!keys.jump && p.vy < -4) p.vy = -4; // variable jump height

  p.vy += GRAV;
  if (p.vy > 14) p.vy = 14;
  moveAndCollide(p);

  // fall off world
  if (p.y > LEVEL_H + 60) damage(true);

  // coins
  for (const c of coins){
    if (c.got) continue;
    c.t += 0.15;
    if (aabb(p, {x:c.x-8,y:c.y-8,w:16,h:16})){
      c.got = true; score += 10; msgFlash("+10");
      spawnParticles(c.x, c.y, "#ffcf3d", 6); sfx.coin();
    }
  }
  // powerups
  for (const pu of powerups){
    if (pu.got) continue; pu.t += 0.1;
    if (aabb(p, pu)){
      pu.got = true; sfx.power();
      spawnParticles(pu.x+pu.w/2, pu.y+pu.h/2, "#fff", 12);
      if (pu.kind==="speed"){ p.speedT = 60*8; msgFlash("SPEED!"); }
      if (pu.kind==="jump"){ p.jumpT = 60*8; msgFlash("HIGH JUMP!"); }
      if (pu.kind==="star"){ p.starT = 60*7; msgFlash("INVINCIBLE!"); }
    }
  }
  // enemies
  for (const e of enemies){
    if (!e.alive) continue;
    e.vy += GRAV; if (e.vy>14) e.vy=14;
    // horizontal with turn-at-edge/wall
    e.x += e.vx;
    let hit=false;
    for (const s of solids){ if (aabb(e,s)){ e.x -= e.vx; e.vx*=-1; hit=true; break; } }
    if (!hit){
      // turn at ledges
      const aheadX = e.vx>0 ? e.x+e.w+1 : e.x-1;
      const footY = e.y+e.h+1;
      let ground=false;
      for (const s of solids){ if (aheadX>=s.x&&aheadX<=s.x+s.w&&footY>=s.y&&footY<=s.y+s.h){ground=true;break;} }
      if (!ground) e.vx*=-1;
    }
    e.y += e.vy;
    for (const s of solids){ if (aabb(e,s)){ if(e.vy>0){e.y=s.y-e.h;} e.vy=0; } }

    if (aabb(p,e)){
      const stomping = p.vy>0 && (p.y+p.h) - e.y < 14;
      if (p.starT>0){ e.alive=false; score+=50; spawnParticles(e.x+e.w/2,e.y,"#ff5d5d",10); sfx.stomp(); }
      else if (stomping){
        e.alive=false; p.vy=-8; score+=50; msgFlash("+50");
        spawnParticles(e.x+e.w/2,e.y,"#ff5d5d",10); sfx.stomp();
      } else damage(false);
    }
  }
  // flag / win
  if (flag && aabb(p, flag)){ win(); }

  // particles
  for (const pt of particles){ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.2; pt.life-=0.03; }
  particles = particles.filter(pt => pt.life>0);

  // camera
  cam.x = Math.max(0, Math.min(LEVEL_W - W, p.x + p.w/2 - W/2));
  cam.y = Math.max(0, Math.min(LEVEL_H - H, p.y + p.h/2 - H/2));
}

function damage(fell){
  const p = player;
  if (p.starT>0 && !fell) return;
  if (p.hurtT>0 && !fell) return;
  lives--; sfx.hurt(); p.hurtT = 90;
  spawnParticles(p.x+p.w/2, p.y+p.h/2, "#ff3d3d", 12);
  if (lives <= 0){ gameOver(); return; }
  // respawn at level start
  p.x = TILE*2; p.y = TILE*2; p.vx=0; p.vy=0;
  p.speedT=p.jumpT=p.starT=0;
}

function msgFlash(t){ msg=t; msgT=45; }

// ---------- Render ----------
function clamp01(v){ return Math.max(0,Math.min(1,v)); }
// wrap a parallax x into the visible band so layers scroll & repeat seamlessly
function wrap(x, span){ return ((x % span) + span) % span; }
function drawBackground(){
  // sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#6db3ff"); g.addColorStop(1,"#bfe3ff");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // parallax hills (slow layer)
  ctx.fillStyle="#7fd17f";
  const hillSpan = 200;
  for (let i=-1;i<W/hillSpan+2;i++){
    const hx = i*hillSpan - wrap(cam.x*0.4, hillSpan);
    ctx.beginPath(); ctx.arc(hx, H-26, 90, Math.PI, 0); ctx.fill();
  }
  // clouds (slower layer)
  ctx.fillStyle="rgba(255,255,255,.85)";
  const cloudSpan = W+160;
  for (let i=0;i<5;i++){
    const cx = i*230 - wrap(cam.x*0.25 + i*230, cloudSpan);
    cloud(cx, 40 + (i%2)*26);
  }
}
function cloud(x,y){
  ctx.beginPath();
  ctx.arc(x,y,14,0,7); ctx.arc(x+16,y+4,18,0,7); ctx.arc(x+36,y,14,0,7);
  ctx.rect(x,y,36,16); ctx.fill();
}

function px(x){ return Math.round(x - cam.x); }
function py(y){ return Math.round(y - cam.y); }

function drawTile(s){
  const x=px(s.x), y=py(s.y);
  if (s.type==="brick"){
    ctx.fillStyle="#8a5a2b"; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle="#6b4220";
    ctx.fillRect(x,y+TILE/2-1,TILE,2);
    ctx.fillRect(x+TILE/2-1,y,2,TILE/2);
    ctx.fillRect(x+TILE/4,y+TILE/2,2,TILE/2);
    ctx.fillRect(x+TILE*0.75,y+TILE/2,2,TILE/2);
    ctx.fillStyle="rgba(255,255,255,.12)"; ctx.fillRect(x,y,TILE,3);
  } else {
    ctx.fillStyle="#3aa655"; ctx.fillRect(x,y,TILE,6);
    ctx.fillStyle="#7a5230"; ctx.fillRect(x,y+6,TILE,TILE-6);
    ctx.fillStyle="rgba(0,0,0,.15)"; ctx.fillRect(x,y+TILE-3,TILE,3);
  }
}

function drawCoin(c){
  if (c.got) return;
  const bob = Math.sin(c.t)*2;
  const x=px(c.x), y=py(c.y)+bob;
  const wob = Math.abs(Math.cos(c.t))*4+2;
  ctx.fillStyle="#ffcf3d";
  ctx.beginPath(); ctx.ellipse(x,y,wob,7,0,0,7); ctx.fill();
  ctx.fillStyle="#fff4b8";
  ctx.beginPath(); ctx.ellipse(x-1,y-1,Math.max(1,wob-3),4,0,0,7); ctx.fill();
}

function drawPowerup(pu){
  if (pu.got) return;
  const bob = Math.sin(pu.t*2)*2;
  const x=px(pu.x), y=py(pu.y)+bob, s=pu.w;
  const col = pu.kind==="speed"?"#36e0ff":pu.kind==="jump"?"#9dff5d":"#ffd23d";
  ctx.fillStyle="#000"; ctx.fillRect(x-1,y-1,s+2,s+2);
  ctx.fillStyle=col; ctx.fillRect(x,y,s,s);
  ctx.fillStyle="rgba(255,255,255,.6)"; ctx.fillRect(x+2,y+2,s-4,3);
  ctx.fillStyle="#0a1a2a"; ctx.font="bold 11px monospace"; ctx.textAlign="center";
  ctx.fillText(pu.kind==="speed"?"»":pu.kind==="jump"?"↑":"★", x+s/2, y+s-3);
  ctx.textAlign="left";
}

// Zerox — tailless dog enemies
function drawEnemy(e){
  if (!e.alive) return;
  const x=px(e.x), y=py(e.y), w=e.w, h=e.h;
  const dir = e.vx<0 ? -1 : 1;
  const body="#8a6b4a", dark="#5f4730", muzzle="#caa370";

  // draw facing-right, then mirror around the sprite centre for facing-left
  ctx.save();
  ctx.translate(x + w/2, 0); ctx.scale(dir, 1); ctx.translate(-(x + w/2), 0);

  ctx.fillStyle="#000"; ctx.fillRect(x-1,y-1,w+2,h+2); // outline
  ctx.fillStyle=body;  ctx.fillRect(x,y,w,h);          // body
  ctx.fillStyle=dark;  ctx.fillRect(x,y,w,3);          // darker back
  ctx.fillStyle=dark;  ctx.fillRect(x+1,y,4,9);        // floppy ear (back)
  ctx.fillStyle=muzzle;ctx.fillRect(x+w-6,y+8,7,6);    // snout (front)
  ctx.fillStyle="#1a1a1a"; ctx.fillRect(x+w-1,y+9,2,3);// nose
  ctx.fillStyle=dark;  ctx.fillRect(x+w-6,y+13,7,1);   // mouth
  ctx.fillStyle="#fff"; ctx.fillRect(x+w-9,y+4,3,3);   // eye
  ctx.fillStyle="#000"; ctx.fillRect(x+w-8,y+5,2,2);   // pupil
  ctx.fillStyle=dark;  ctx.fillRect(x+w-9,y+3,4,1);    // brow
  ctx.fillStyle="#e23d3d"; ctx.fillRect(x+w-11,y+10,2,h-12); // collar

  // legs shuffle (NO tail)
  const f = Math.floor(Date.now()/120)%2;
  ctx.fillStyle=dark;
  ctx.fillRect(x+2,   y+h, 4, 3+(f?1:0));
  ctx.fillRect(x+w-6, y+h, 4, 3+(f?0:1));

  ctx.restore();
}

function drawFlag(){
  if (!flag) return;
  const x=px(flag.x), y=py(flag.y);
  ctx.fillStyle="#dddddd"; ctx.fillRect(x,y,3,flag.h);
  ctx.fillStyle="#34d058";
  const w = Math.sin(Date.now()/200)*2;
  ctx.beginPath();
  ctx.moveTo(x+3,y+4); ctx.lineTo(x+24+w,y+10); ctx.lineTo(x+3,y+16); ctx.fill();
  ctx.fillStyle="#ffd23d"; ctx.fillRect(x-2,y+flag.h-4,7,4);
}

// Three Tails — a three-tailed cat
function drawPlayer(){
  const p = player;
  if (p.hurtT>0 && Math.floor(Date.now()/80)%2) return; // blink
  const x=px(p.x), y=py(p.y);
  const star = p.starT>0;
  const fur     = star ? `hsl(${Date.now()/3%360},90%,62%)` : "#ff9b3d";
  const furDark = star ? `hsl(${(Date.now()/3+40)%360},90%,50%)` : "#ef7d1f";
  const belly   = star ? "#ffffff" : "#ffe6c2";
  const tip     = star ? "#ffffff" : "#ffd9a8";

  // ---- three tails (drawn behind the body, waving) ----
  const back = p.face>0 ? x+1 : x+p.w-1;   // attach near the rear
  const dir  = -p.face;                      // tails sweep opposite to facing
  const phase = Date.now()/150 + p.anim*0.5;
  for (let t=0; t<3; t++){
    let tx = back, ty = y + 7 + t*4;         // three anchor heights
    for (let seg=0; seg<4; seg++){
      tx += dir*3;
      ty += Math.sin(phase + t*1.1 + seg*0.8)*1.6 - 1; // curl up & wave
      ctx.fillStyle = furDark;
      ctx.fillRect(Math.round(tx)-1, Math.round(ty)-1, 3, 3);
    }
    ctx.fillStyle = tip; // lighter tail tip
    ctx.fillRect(Math.round(tx)-1, Math.round(ty)-1, 2, 2);
  }

  // ---- ears ----
  ctx.fillStyle = fur;
  ctx.fillRect(x+1, y-3, 4, 4);
  ctx.fillRect(x+p.w-5, y-3, 4, 4);
  ctx.fillStyle = "#ff6a9a"; // inner ear
  ctx.fillRect(x+2, y-1, 2, 2);
  ctx.fillRect(x+p.w-4, y-1, 2, 2);

  // ---- body ----
  ctx.fillStyle="#000"; ctx.fillRect(x-1,y-1,p.w+2,p.h+2);
  ctx.fillStyle=fur;    ctx.fillRect(x,y,p.w,p.h);
  ctx.fillStyle=belly;  ctx.fillRect(x+3,y+9,p.w-6,p.h-9); // cream belly
  ctx.fillStyle=furDark;                                    // tabby stripes
  ctx.fillRect(x,y+2,p.w,2);
  ctx.fillRect(x,y+6,p.w,1);

  // ---- face ----
  ctx.fillStyle="#3ad13a"; // green eyes
  ctx.fillRect(x+3,y+3,3,3); ctx.fillRect(x+p.w-6,y+3,3,3);
  ctx.fillStyle="#0a2a0a"; // pupils track facing
  const pe = p.face>0?1:0;
  ctx.fillRect(x+3+pe,y+4,1,2); ctx.fillRect(x+p.w-6+pe,y+4,1,2);
  ctx.fillStyle="#ff6a9a"; ctx.fillRect(x+p.w/2-1,y+6,2,2); // nose
  ctx.fillStyle="rgba(255,255,255,.85)"; // whiskers
  ctx.fillRect(x-3,y+6,4,1); ctx.fillRect(x-3,y+8,3,1);
  ctx.fillRect(x+p.w-1,y+6,4,1); ctx.fillRect(x+p.w-2,y+8,3,1);

  // ---- paws (animate while running) ----
  const step = p.onGround && Math.abs(p.vx)>0.3 ? Math.floor(p.anim)%2 : 0;
  ctx.fillStyle=tip;
  ctx.fillRect(x+2, y+p.h, 5, 3+step);
  ctx.fillRect(x+p.w-7, y+p.h, 5, 3+(1-step));
}

function drawHUD(){
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(0,0,W,22);
  ctx.fillStyle="#ffcf3d"; ctx.font="bold 13px monospace"; ctx.textAlign="left";
  ctx.fillText("● "+String(score).padStart(5,"0"), 8, 15);
  // lives
  ctx.textAlign="right";
  ctx.fillStyle="#ff5d5d"; ctx.fillText("♥".repeat(Math.max(0,lives)), W-8, 15);
  // active power timers
  ctx.textAlign="center"; ctx.font="bold 11px monospace";
  const p=player; const tags=[];
  if (p.speedT>0) tags.push(["SPD","#36e0ff",p.speedT]);
  if (p.jumpT>0) tags.push(["JMP","#9dff5d",p.jumpT]);
  if (p.starT>0) tags.push(["★","#ffd23d",p.starT]);
  tags.forEach((t,i)=>{ ctx.fillStyle=t[1]; ctx.fillText(t[0]+":"+Math.ceil(t[2]/60), W/2 + (i-tags.length/2)*46+23, 15); });
  // flash msg
  if (msgT>0){
    ctx.globalAlpha = clamp01(msgT/45);
    ctx.fillStyle="#fff"; ctx.font="bold 18px monospace"; ctx.textAlign="center";
    ctx.fillText(msg, W/2, 50); ctx.globalAlpha=1; msgT--;
  }
  ctx.textAlign="left";
}

// ---------- Intro cutscene ----------
// Standalone sprites (drawn at local origin, facing right) so the cutscene
// can scale/place Three Tails and the Zerox without touching game objects.
function catLocal(phase){
  const w=16,h=22, fur="#ff9b3d",furDark="#ef7d1f",belly="#ffe6c2",tip="#ffd9a8";
  for (let t=0;t<3;t++){           // three tails sweep behind (to the left)
    let tx=1, ty=7+t*4;
    for (let seg=0;seg<4;seg++){
      tx-=3; ty+=Math.sin(phase+t*1.1+seg*0.8)*1.6-1;
      ctx.fillStyle=furDark; ctx.fillRect(Math.round(tx)-1,Math.round(ty)-1,3,3);
    }
  }
  ctx.fillStyle=fur; ctx.fillRect(1,-3,4,4); ctx.fillRect(w-5,-3,4,4);        // ears
  ctx.fillStyle="#ff6a9a"; ctx.fillRect(2,-1,2,2); ctx.fillRect(w-4,-1,2,2);
  ctx.fillStyle="#000"; ctx.fillRect(-1,-1,w+2,h+2);
  ctx.fillStyle=fur; ctx.fillRect(0,0,w,h);
  ctx.fillStyle=belly; ctx.fillRect(3,9,w-6,h-9);
  ctx.fillStyle=furDark; ctx.fillRect(0,2,w,2); ctx.fillRect(0,6,w,1);
  ctx.fillStyle="#3ad13a"; ctx.fillRect(3,3,3,3); ctx.fillRect(w-6,3,3,3);    // eyes
  ctx.fillStyle="#0a2a0a"; ctx.fillRect(4,4,1,2); ctx.fillRect(w-5,4,1,2);
  ctx.fillStyle="#ff6a9a"; ctx.fillRect(w/2-1,6,2,2);
  ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillRect(w-1,6,4,1); ctx.fillRect(w-2,8,3,1);
  const st=Math.floor(phase)%2;                                              // paws
  ctx.fillStyle=tip; ctx.fillRect(2,h,5,3+st); ctx.fillRect(w-7,h,5,3+(1-st));
}
function dogLocal(phase){
  const w=18,h=20,body="#8a6b4a",dark="#5f4730",muzzle="#caa370";
  ctx.fillStyle="#000"; ctx.fillRect(-1,-1,w+2,h+2);
  ctx.fillStyle=body; ctx.fillRect(0,0,w,h);
  ctx.fillStyle=dark; ctx.fillRect(0,0,w,3);
  ctx.fillStyle=dark; ctx.fillRect(1,0,4,9);            // floppy ear
  ctx.fillStyle=muzzle; ctx.fillRect(w-6,8,7,6);        // snout
  ctx.fillStyle="#1a1a1a"; ctx.fillRect(w-1,9,2,3);     // nose
  ctx.fillStyle=dark; ctx.fillRect(w-6,13,7,1);         // mouth
  ctx.fillStyle="#fff"; ctx.fillRect(w-9,4,3,3);
  ctx.fillStyle="#000"; ctx.fillRect(w-8,5,2,2);
  ctx.fillStyle=dark; ctx.fillRect(w-9,3,4,1);          // brow
  ctx.fillStyle="#e23d3d"; ctx.fillRect(w-11,10,2,h-12);// collar (no tail)
  const f=Math.floor(phase)%2;
  ctx.fillStyle=dark; ctx.fillRect(2,h,4,3+(f?1:0)); ctx.fillRect(w-6,h,4,3+(f?0:1));
}
function drawSprite(fn, x, y, s, face, phase){
  ctx.save();
  ctx.translate(x, y); ctx.scale(s*face, s);
  fn(phase);
  ctx.restore();
}
function introCaption(text, alpha){
  ctx.globalAlpha=clamp01(alpha);
  ctx.fillStyle="#000"; ctx.fillRect(0,H-28,W,28);
  ctx.fillStyle="#ffcf3d"; ctx.font="bold 14px monospace"; ctx.textAlign="center";
  ctx.fillText(text, W/2, H-10);
  ctx.globalAlpha=1; ctx.textAlign="left";
}
const INTRO = { title:1900, cat:4400, dogs:7000, action:9600, end:10800 };
function renderIntro(ms){
  // starfield night sky
  ctx.fillStyle="#0b0d20"; ctx.fillRect(0,0,W,H);
  for (let i=0;i<46;i++){
    ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(ms/350+i));
    ctx.fillStyle="#fff"; ctx.fillRect((i*97)%W,(i*53)%(H-50),2,2);
  }
  ctx.globalAlpha=1;
  const gY=H-40;
  ctx.fillStyle="#16223c"; ctx.fillRect(0,gY,W,40);     // ground
  ctx.fillStyle="#22365c"; ctx.fillRect(0,gY,W,4);
  const phase=ms/120;

  if (ms < INTRO.title){
    const a = clamp01((ms-200)/700) * (ms>1400 ? clamp01((INTRO.title-ms)/500) : 1);
    ctx.globalAlpha=a;
    ctx.fillStyle="#5d83ff"; ctx.font="bold 34px monospace"; ctx.textAlign="center";
    ctx.fillText("★ PIXEL DASH ★", W/2, H/2-6);
    ctx.fillStyle="#cfe0ff"; ctx.font="bold 12px monospace";
    ctx.fillText("a tale of one cat and many dogs", W/2, H/2+18);
    ctx.globalAlpha=1; ctx.textAlign="left";
  } else {
    // Three Tails walks in from the left and settles on the left third
    const walk = clamp01((ms-INTRO.title)/1400);
    let cx = -40 + walk*(W*0.28+40), cy = gY-44;
    if (ms >= INTRO.action){                  // hop happily during the finale
      const jt=(ms-INTRO.action)/420;
      cy = gY-44 - Math.abs(Math.sin(jt*Math.PI))*30;
    }
    drawSprite(catLocal, cx, cy, 2, 1, phase);

    // The Zerox pack marches in from the right, facing the cat
    if (ms >= INTRO.cat){
      const inn = clamp01((ms-INTRO.cat)/1500);
      for (let i=0;i<3;i++){
        const dx = W+60 - inn*(W*0.42) - i*46;
        drawSprite(dogLocal, dx, gY-40, 2, -1, phase+i*0.7);
      }
    }

    let cap;
    if (ms < INTRO.cat)        cap = "MEET THREE TAILS — THE THREE-TAILED CAT";
    else if (ms < INTRO.dogs)  cap = "...BUT THE ZEROX ARE ON THE PROWL";
    else if (ms < INTRO.action)cap = "TAILLESS DOGS. NO MERCY.";
    else                       cap = "STOMP 'EM • GRAB COINS • REACH THE FLAG!";
    introCaption(cap, 1);
  }

  // skip hint
  ctx.globalAlpha=0.6; ctx.fillStyle="#fff"; ctx.font="bold 9px monospace"; ctx.textAlign="right";
  ctx.fillText("SPACE / CLICK TO SKIP ▶", W-8, 14); ctx.globalAlpha=1; ctx.textAlign="left";

  // fade to menu
  if (ms >= INTRO.end-600){
    ctx.globalAlpha=clamp01((ms-(INTRO.end-600))/600);
    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
  }
  if (ms >= INTRO.end) endIntro();
}

function render(){
  drawBackground();
  for (const s of solids) drawTile(s);
  for (const c of coins) drawCoin(c);
  for (const pu of powerups) drawPowerup(pu);
  drawFlag();
  for (const e of enemies) drawEnemy(e);
  for (const pt of particles){
    ctx.globalAlpha = clamp01(pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(px(pt.x), py(pt.y), 3,3);
  }
  ctx.globalAlpha=1;
  drawPlayer();
  drawHUD();
}

// ---------- Game states ----------
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ov-title");
const ovText = document.getElementById("ov-text");
const ovBtn = document.getElementById("ov-btn");

function showOverlay(title, text, btn){
  ovTitle.textContent = title; ovText.textContent = text; ovBtn.textContent = btn;
  overlay.classList.remove("hidden");
}
function hideOverlay(){ overlay.classList.add("hidden"); }

const MENU_TEXT = "Play as Three Tails, the three-tailed cat! Reach the flag — stomp the Zerox dogs, grab coins, and collect power-ups: » Speed, ↑ High-Jump, ★ Invincibility.";
function endIntro(){
  if (state !== "intro") return;
  state = "menu";
  showOverlay("PIXEL DASH", MENU_TEXT, "PLAY");
}
function startGame(){
  score = 0; lives = 3; msg=""; msgT=0;
  buildLevel(); state = "play"; hideOverlay();
}
function gameOver(){
  state = "over";
  showOverlay("GAME OVER", `You scored ${score} points. The flag awaits — give it another run!`, "RETRY");
}
function win(){
  state = "win"; sfx.win();
  const bonus = lives*100; score += bonus;
  showOverlay("YOU WIN! ★", `You reached the flag! Score ${score} (lives bonus +${bonus}). Nicely dashed.`, "PLAY AGAIN");
}

ovBtn.addEventListener("click", startGame);

// ---------- Main loop ----------
state = "intro"; score=0; lives=3; msg=""; msgT=0; buildLevel();
let introMs = 0;
let last = performance.now(), acc = 0; const STEP = 1000/60;
function loop(now){
  const dt = now - last;
  acc += dt; last = now;
  let guard=0;
  while (acc >= STEP && guard++ < 5){ update(); acc -= STEP; }
  if (state === "intro"){ introMs += dt; renderIntro(introMs); }
  else render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// click/tap the canvas to skip the intro
canvas.addEventListener("click", () => { if (state === "intro") endIntro(); });

// responsive scale
function fit(){
  const stage = document.getElementById("stage");
  const maxW = Math.min(window.innerWidth-24, 960);
  const scale = Math.max(1, Math.floor(maxW / W));
  const finalW = Math.min(maxW, W*scale);
  canvas.style.width = finalW+"px";
  canvas.style.height = (finalW*H/W)+"px";
}
addEventListener("resize", fit); fit();
// the cutscene plays first; the menu overlay appears when it ends (or is skipped)
hideOverlay();
})();
</script>
